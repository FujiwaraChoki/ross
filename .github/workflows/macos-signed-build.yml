name: Signed macOS Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-14
    permissions:
      contents: read

    env:
      CSC_NAME: 'SAMI HINDI (HL34V4TRZ5)'
      APPLE_CODESIGN_IDENTITY: 'Developer ID Application: SAMI HINDI (HL34V4TRZ5)'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24 | tr -d '\n')"
          CERT_PATH="$RUNNER_TEMP/ross-signing-identities.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/ross-signing.keychain-db"
          export CERT_PATH

          python3 - <<'PY'
          import base64
          import os
          cert_bytes = base64.b64decode(os.environ["BUILD_CERTIFICATE_BASE64"])
          with open(os.environ["CERT_PATH"], "wb") as f:
              f.write(cert_bytes)
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          {
            echo "CSC_LINK=$CERT_PATH"
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"
        shell: bash

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s\n' "$APPLE_API_KEY_SECRET" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"

          {
            echo "APPLE_API_KEY=$API_KEY_PATH"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"
        shell: bash

      - name: Build signed and notarized macOS artifacts
        env:
          CSC_KEY_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: pnpm build:mac

      - name: Sign and notarize DMG artifacts
        run: pnpm exec bash scripts/sign-and-notarize-dmg.sh dist/*.dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ross-macos-signed
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
          if-no-files-found: error
